# Dedicated, opt-in LAN demo listener. No changes to Laragon or production.
ServerRoot "C:/laragon/bin/apache/httpd-2.4.62-240904-win64-VS17"
Listen 192.168.1.80:8443
ServerName 192.168.1.80:8443
ServerTokens Prod
ServerSignature Off
PidFile "C:/laragon/www/vending-attendance/storage/framework/local-https/httpd-lan-192.168.1.80.pid"
ErrorLog "C:/laragon/www/vending-attendance/storage/framework/local-https/error-lan-192.168.1.80.log"
LogLevel warn
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule fcgid_module "C:/laragon/etc/apache2/modules/mod_fcgid.so"
TypesConfig conf/mime.types
SSLEngine on
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
SSLCertificateFile "C:/laragon/www/vending-attendance/storage/framework/local-https/server-192.168.1.80.pem"
SSLCertificateKeyFile "C:/laragon/www/vending-attendance/storage/framework/local-https/server-192.168.1.80.key"
SSLSessionCache "shmcb:C:/laragon/www/vending-attendance/storage/framework/local-https/ssl_cache_lan_192_168_1_80(512000)"
DocumentRoot "C:/laragon/www/vending-attendance/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "C:/laragon/www/vending-attendance/public">
    Options -Indexes +ExecCGI +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    <FilesMatch "\.php$">
        SetHandler fcgid-script
    </FilesMatch>
    FcgidWrapper "C:/laragon/bin/php/php-8.4.15-nts-Win32-vs17-x64/php-cgi.exe" .php
</Directory>
FcgidInitialEnv PHPRC "C:/laragon/bin/php/php-8.4.15-nts-Win32-vs17-x64"
FcgidInitialEnv SystemRoot "C:/Windows"
# PHP buffers larger request bodies in a temporary file. Without TEMP/TMP,
# this minimal Windows FastCGI environment falls back to unwritable C:/Windows.
# Scope to this DEMO process only; directory inherits the private TLS-root ACL.
FcgidInitialEnv TEMP "C:/laragon/www/vending-attendance/storage/framework/local-https/php-tmp"
FcgidInitialEnv TMP "C:/laragon/www/vending-attendance/storage/framework/local-https/php-tmp"
FcgidMaxProcesses 4
FcgidProcessTableFile "C:/laragon/www/vending-attendance/storage/framework/local-https/fcgid_shm_lan_192_168_1_80"
FcgidIOTimeout 30
# 5 MiB evidence, base64 native JSON envelope and 64 KiB metadata overhead.
# Request size only: TLS protocols, trust, certificates and bind address unchanged.
FcgidMaxRequestLen 7056044
# Direct TLS FastCGI conveys HTTPS=on. Do not trust forwarded client headers.
RequestHeader unset Proxy early
RequestHeader unset X-Forwarded-Proto early
RequestHeader unset X-Forwarded-Host early
RequestHeader unset X-Forwarded-For early
RequestHeader unset Forwarded early
# No request/access body logging and no shared Laragon configuration includes.
