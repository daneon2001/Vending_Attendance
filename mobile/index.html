<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Vending Attendance · MEDICAL LIFE ONE</title>

    <base href="/" />

    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="/medical-life-mark.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vending Attendance" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="app"><div class="brand-startup" role="status" aria-label="Iniciando Vending Attendance">
      <img class="startup-logo" src="/brand/one-logo.png" alt="MEDICAL LIFE ONE" width="144" height="144" />
      <strong>Vending Attendance</strong><span>Tecnología en Movimiento</span>
      <img class="startup-dispenser" src="/brand/dispenser-portrait.webp" alt="Dispensadora de medicamentos Medical Life" width="588" height="630" />
      <span class="startup-loading">Preparando tu espacio de trabajo…</span>
    </div></div>
    <style>
      .brand-startup{box-sizing:border-box;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px 24px;background:linear-gradient(160deg,#fff 65%,#e7f7f1 82%,#d9f2ff);color:#10366c;font-family:Arial,sans-serif;text-align:center}
      .startup-logo{width:120px;height:120px;object-fit:contain;border-radius:24px}.brand-startup strong{font-size:22px}.brand-startup span{font-size:14px}.startup-dispenser{width:auto;max-width:85%;height:32dvh;object-fit:contain;border-radius:20px;margin:12px 0}.startup-loading{color:#526574}
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
