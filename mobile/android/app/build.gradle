apply plugin: 'com.android.application'

// Opt-in candidate only. Production/release version and signing remain separate.
def internalBeta = providers.gradleProperty('internalBeta').orNull == 'true'
// One validator implementation for Vite, runtime and native builds.
def originGate = file('../../build/verify-deployment.mjs')
def runOriginGate = { List args ->
    def output = new ByteArrayOutputStream()
    exec {
        commandLine(['node', originGate.absolutePath] + args)
        standardOutput = output
    }
    output.toString('UTF-8').trim()
}
def betaIdentity = System.getenv('BETA_FIELD_IDENTITY_BASE_URL') ? runOriginGate(['beta-identity']) : ''
def verifyDeployment = { variant ->
    runOriginGate([variant, file('src/main/assets/public/deployment.json').absolutePath])
}
def priorOrigins = System.getenv('FIELD_RECOVERY_PREVIOUS_ORIGIN_SHA256') ?: ''
def debugRecoveryTarget = System.getenv('LOCAL_FIELD_IDENTITY_BASE_URL') ?: ''
def javaString = { value -> groovy.json.JsonOutput.toJson(value) }

def betaMetadata = new groovy.json.JsonSlurper().parse(file('../../internal-beta.json'))

def releaseStoreFile = System.getenv('VENDING_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('VENDING_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('VENDING_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('VENDING_ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() }

android {
    namespace "com.medicalife.vendingattendance"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.medicalife.vendingattendance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode internalBeta ? betaMetadata.build as Integer : 1
        versionName internalBeta ? betaMetadata.version : "1.0"
        buildConfigField 'String', 'FIELD_RECOVERY_TARGET', '""'
        buildConfigField 'String', 'FIELD_RECOVERY_PREVIOUS_SHA256', '""'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'FIELD_RECOVERY_TARGET', javaString(debugRecoveryTarget)
            buildConfigField 'String', 'FIELD_RECOVERY_PREVIOUS_SHA256', javaString(priorOrigins)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        beta {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            buildConfigField 'String', 'FIELD_RECOVERY_TARGET', javaString(betaIdentity)
            buildConfigField 'String', 'FIELD_RECOVERY_PREVIOUS_SHA256', javaString(priorOrigins)
            // Explicit transitional opt-in; never creates or rotates a key.
            if (providers.gradleProperty('betaUseExistingDebugSigning').orNull == 'true') {
                signingConfig signingConfigs.debug
            }
        }
    }
    sourceSets.debug.res.srcDir layout.buildDirectory.dir('generated/localNetworkRes')
}

tasks.register('generateLocalNetworkPolicy') {
    def output = layout.buildDirectory.file('generated/localNetworkRes/xml/field_demo_network_security.xml')
    outputs.file(output)
    inputs.property('host', System.getenv('LOCAL_DEBUG_CA_HOST') ?: '')
    doLast {
        def host = System.getenv('LOCAL_DEBUG_CA_HOST') ?: ''
        if (host && !(host ==~ /[a-zA-Z0-9][a-zA-Z0-9.-]*/)) throw new GradleException('Invalid LOCAL_DEBUG_CA_HOST')
        def domain = host ? '<domain-config cleartextTrafficPermitted="true"><domain includeSubdomains="false">'+host+'</domain><trust-anchors><certificates src="system"/><certificates src="user"/></trust-anchors></domain-config>' : ''
        def f = output.get().asFile
        f.parentFile.mkdirs()
        f.text = '<network-security-config><base-config cleartextTrafficPermitted="true"><trust-anchors><certificates src="system"/></trust-anchors></base-config>'+domain+'</network-security-config>'
    }
}
tasks.register('verifyBetaConfiguration') {
    doLast {
        verifyDeployment('beta')
        if ((betaMetadata.build as Integer) <= 10 || !internalBeta) throw new GradleException('Beta requires new metadata above historical build 10 and -PinternalBeta=true')
        if (!releaseSigningConfigured && providers.gradleProperty('betaUseExistingDebugSigning').orNull != 'true') throw new GradleException('Explicit existing beta signing decision required')
        if (providers.gradleProperty('betaUseExistingDebugSigning').orNull == 'true' && !android.signingConfigs.debug.storeFile.isFile()) throw new GradleException('Existing debug signing keystore missing; generating a replacement is forbidden')
        if (priorOrigins && !(priorOrigins ==~ /[a-f0-9]{64}(,[a-f0-9]{64})*/)) throw new GradleException('Recovery allowlist must contain SHA256 origin digests')
    }
}

tasks.register('verifyPilotReleaseConfiguration') {
    doLast {
        if (internalBeta) {
            throw new GradleException('Internal beta metadata is DEBUG only. Do not build release with -PinternalBeta=true.')
        }
        verifyDeployment('release')
        if (!releaseSigningConfigured || !file(releaseStoreFile).exists()) {
            throw new GradleException('Release signing must be supplied through VENDING_ANDROID_* environment variables.')
        }
    }
}

tasks.configureEach {
    if (name == 'preDebugBuild') dependsOn tasks.named('generateLocalNetworkPolicy')
    if (name == 'preBetaBuild') dependsOn tasks.named('verifyBetaConfiguration')
    if (name == 'preReleaseBuild') {
        dependsOn tasks.named('verifyPilotReleaseConfiguration')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
