stages:
  - deploy

deploy_qa:
  stage: deploy
  tags:
    - qa-windows
  only:
    - qa
  script:
    - pwsh -ExecutionPolicy Bypass -File scripts/deploy_qa.ps1
  environment:
    name: qa
    url: https://desarrollo.sybiml3.com/biometrico

deploy_production:
  stage: deploy
  tags:
    - windows
    - prod
    - biometrico
  only:
    - main
  when: manual
  script:
    - pwsh -ExecutionPolicy Bypass -File scripts/deploy_production.ps1
  environment:
    name: production
    url: https://biometrico.sybiml.com