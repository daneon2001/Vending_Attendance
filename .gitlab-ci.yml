stages:
  - deploy

deploy_qa:
  stage: deploy
  tags:
    - qa-windows
  only:
    - qa
  script:
    - powershell -ExecutionPolicy Bypass -File scripts/deploy_qa.ps1
  environment:
    name: qa
    url: https://desarrollo.sybiml3.com/biometrico

deploy_production:
  stage: deploy
  tags:
    - windows
    - prod
    - biometrico
  only:
    - main
  when: manual
  script:
    - 'Write-Host "=== DEPLOY PRODUCCION BIOMETRICO ==="'
    - 'cd D:\biometrico\biometrico'
    - 'git fetch origin'
    - 'git checkout main'
    - 'git reset --hard origin/main'
    - 'composer install --no-dev --optimize-autoloader'
    - 'npm ci'
    - 'npm run build'
    - 'php artisan optimize:clear'
    - 'php artisan config:cache'
    - 'php artisan route:cache'
    - 'php artisan view:cache'
    - 'Write-Host "=== DEPLOY FINALIZADO ==="'
  environment:
    name: production
    url: https://biometrico.sybiml.com